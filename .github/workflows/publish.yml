name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.release.outputs.new_release_git_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Build
        run: npm run build

      - name: Semantic Release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Signed provenance attestation on npmjs.com (uses the job's id-token: write).
          NPM_CONFIG_PROVENANCE: true

      - name: Build Storybook
        if: steps.release.outputs.new_release_published == 'true'
        run: npm run build-storybook

      - name: Upload Storybook artifact
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  github-packages:
    name: Publish to GitHub Packages
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_release_git_tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@eljijuna'

      - name: Install dependencies
        run: npm ci

      # GitHub Packages only accepts scoped names matching the repo owner.
      # The npmjs.com package keeps its unscoped name; this rewrite is local to the runner.
      - name: Scope package for GitHub Packages
        run: |
          npm pkg set name='@eljijuna/floaty-widget'
          npm pkg set version='${{ needs.release.outputs.new_release_version }}'
          npm pkg delete publishConfig

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  storybook:
    name: Deploy Storybook
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
